[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modconv"
version = "0.1.0"
description = "多目标模型转换工具（HF/ONNX/MLX/GGUF → Core ML/ONNX/MLX/GGUF，PyQt6 GUI）"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]
# torch 上限锁在 2.7.x：coremltools 9.0 仅与 torch 2.7.0 做过适配。
# 3.13 重装依赖时若无上限会被拉到 2.14.x，其 torch.export 的
# run_decompositions(AOT 阶段) 会崩溃，导致转换全流程失败。
convert = ["torch>=2.2,<2.8", "torchvision>=0.17,<0.23", "transformers>=4.44", "coremltools>=8.0", "safetensors>=0.4", "numpy",
           # MLX 量化模型反量化需要（仅 macOS）
           "mlx-lm>=0.25; platform_system=='Darwin'",
           # 新增目标：ONNX / MLX(encoder) / MLX(vlm) / GGUF
           "onnx>=1.14", "onnxruntime>=1.16",
           "mlx-embeddings>=0.0.10; platform_system=='Darwin'",
           "mlx-vlm>=0.1.0; platform_system=='Darwin'",
           "gguf>=0.6"]

[project.scripts]
modconv = "modconv.app:main"

[tool.setuptools.packages.find]
include = ["modconv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # 第三方库的版本兼容噪音（torch 2.14 / coremltools 9 / transformers 5 组合）
    "ignore::UserWarning:coremltools.*",
    "ignore::Warning:coremltools.*",
    "ignore::FutureWarning:torch.*",
    "ignore::UserWarning:torch.*",
    "ignore:.*torch.jit.trace.*:Warning",
    "ignore::UserWarning:transformers.*",
    "ignore::Warning:transformers.masking_utils.*",
]
